services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-container
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "mysecretpassword"
      POSTGRES_DB: org_inventory
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d org_inventory"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
